name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]
  merge_group:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  type-checking:
    name: Type checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check application, manual fixtures, and build configuration types
        run: npm run type-check

  check:
    name: Check
    if: always()
    needs: [linting, type-checking]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both verification jobs to succeed
        env:
          LINT_RESULT: ${{ needs.linting.result }}
          TYPE_CHECK_RESULT: ${{ needs.type-checking.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TYPE_CHECK_RESULT" = success
